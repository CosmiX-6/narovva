<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>CU motion reel</title>
    <script src="vendor/gsap.min.js"></script>
    <!-- Staged per render by narovva.motion.stage: defines window.CU_DECK. -->
    <script src="deck.js"></script>
    <style>
      @font-face { font-family: "Archivo Black"; src: url("fonts/archivo-black-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Inter"; src: url("fonts/inter-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
      @font-face { font-family: "Inter"; src: url("fonts/inter-latin-700-normal.woff2") format("woff2"); font-weight: 700; }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      :root { --navy: #0A0E1A; --ink: #F3F5FA; --muted: #9AA3BA; --accent: #3B82F6; --card: rgba(255,255,255,.06); }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--navy); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Inter", sans-serif; color: var(--ink); }

      /* Persistent layer: background, brand header, handle, global progress.
         Reels UI safe zones: content lives inside x 72..930, y 400..1440. */
      .bg, .bg * { position: absolute; pointer-events: none; }
      .bg { inset: 0; }
      .glow { width: 1300px; height: 1300px; left: -110px; top: 380px; border-radius: 50%;
        background: radial-gradient(circle, var(--accent) 0%, rgba(10,14,26,0) 62%); opacity: .28; }
      .grid { inset: 0; background-image: linear-gradient(rgba(255,255,255,.045) 2px, transparent 2px), linear-gradient(90deg, rgba(255,255,255,.045) 2px, transparent 2px); background-size: 90px 90px; }
      .vignette { inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(10,14,26,0) 40%, rgba(10,14,26,.85) 100%); }
      .brand { position: absolute; left: 72px; top: 230px; display: flex; align-items: center; gap: 22px; }
      .brand img { width: 96px; height: 96px; border-radius: 22px; display: block; }
      .brand span { font-weight: 700; font-size: 30px; letter-spacing: .22em; }
      .handle { position: absolute; left: 72px; top: 1478px; font-weight: 700; font-size: 34px; letter-spacing: .04em; opacity: .85; }
      .progress { position: absolute; left: 72px; right: 150px; top: 1560px; height: 6px; background: rgba(255,255,255,.12); border-radius: 3px; }
      .progress i { display: block; height: 100%; width: 100%; background: var(--accent); border-radius: 3px; transform-origin: left center; }

      .scene { position: absolute; left: 72px; top: 400px; width: 858px; height: 1040px; display: flex; flex-direction: column; justify-content: center; }
      .kicker { align-self: flex-start; padding: 14px 28px; border-radius: 999px; font-weight: 700; font-size: 30px; letter-spacing: .18em; color: var(--navy); background: var(--accent); margin-bottom: 44px; text-transform: uppercase; }
      .h { font-family: "Archivo Black", sans-serif; letter-spacing: -.01em; text-transform: uppercase; line-height: 1.06; }
      .w { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: 8px; margin-right: .26em; }
      .w > span { display: inline-block; }
      .bar { margin-top: 44px; height: 10px; width: 260px; background: var(--accent); border-radius: 5px; transform-origin: left center; }
      .body { margin-top: 40px; font-weight: 500; line-height: 1.32; color: var(--ink); opacity: .92; }
      .muted { color: var(--muted); }
      .acc { color: var(--accent); }

      .card { background: var(--card); border-left: 10px solid var(--accent); border-radius: 18px; padding: 28px 34px; font-weight: 500; line-height: 1.28; margin-top: 22px; }
      .tiles { display: grid; gap: 26px; margin-top: 36px; }
      .tile { background: var(--card); border-radius: 24px; padding: 34px 30px; border-top: 8px solid var(--accent); }
      .tile .num { font-family: "Archivo Black", sans-serif; line-height: 1; color: var(--ink); }
      .tile .lab { margin-top: 14px; font-weight: 500; color: var(--muted); line-height: 1.25; }

      .tl { position: relative; margin-top: 36px; padding-left: 64px; }
      .tl .line { position: absolute; left: 16px; top: 8px; bottom: 8px; width: 6px; background: var(--accent); border-radius: 3px; transform-origin: top center; }
      .ev { position: relative; margin-bottom: 30px; }
      .ev::before { content: ""; position: absolute; left: -62px; top: 10px; width: 26px; height: 26px; border-radius: 50%; background: var(--navy); border: 6px solid var(--accent); }
      .ev .when { font-weight: 700; color: var(--accent); letter-spacing: .08em; text-transform: uppercase; }
      .ev .what { font-weight: 500; line-height: 1.25; margin-top: 6px; }

      .node { background: var(--card); border: 3px solid var(--accent); border-radius: 22px; padding: 24px 32px; }
      .node .actor { font-family: "Archivo Black", sans-serif; text-transform: uppercase; }
      .node .detail { margin-top: 8px; font-weight: 500; color: var(--muted); line-height: 1.25; }
      .link { display: flex; align-items: center; gap: 20px; height: 84px; padding-left: 40px; }
      .link .stem { width: 6px; height: 100%; background: var(--accent); border-radius: 3px; transform-origin: top center; }
      .link .amt { font-weight: 700; color: var(--accent); }

      .vs { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; margin-top: 36px; align-items: end; }
      .side { background: var(--card); border-radius: 24px; padding: 30px; }
      .side .big { font-family: "Archivo Black", sans-serif; line-height: 1.05; overflow-wrap: anywhere; }
      .side .lab { margin-top: 12px; font-weight: 700; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
      .side .meter { margin-top: 24px; height: 18px; border-radius: 9px; background: rgba(255,255,255,.1); }
      .side .meter i { display: block; height: 100%; border-radius: 9px; background: var(--accent); transform-origin: left center; }
      .side.b .meter i { background: var(--ink); }

      .qmark { font-family: "Archivo Black", sans-serif; font-size: 300px; line-height: .6; color: var(--accent); height: 150px; }
      .attr { margin-top: 36px; font-weight: 700; letter-spacing: .06em; color: var(--accent); }

      .ctawrap { align-items: center; text-align: center; }
      .ringbox { position: relative; width: 300px; height: 300px; margin-bottom: 56px; }
      .ringbox img { position: absolute; inset: 30px; width: 240px; height: 240px; border-radius: 54px; }
      .ring { position: absolute; inset: 0; border-radius: 50%; border: 6px solid var(--accent); }
      .big-handle { font-family: "Archivo Black", sans-serif; font-size: 72px; color: var(--accent); margin-top: 28px; overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="cu-reel" data-start="0" data-duration="{{TOTAL}}" data-width="1080" data-height="1920">
      <div class="bg">
        <div class="glow" id="glow" data-layout-allow-overflow></div>
        <div class="grid" id="grid"></div>
        <div class="vignette"></div>
      </div>
      <div class="brand"><img id="logo" src="assets/logo.png" alt="" /><span id="brandname"></span></div>
      <div id="scenes"></div>
      <div class="handle" id="handle"></div>
      <div class="progress"><i id="progress"></i></div>
      <!--HF_AUDIO-->
    </div>
    <script>
      (async () => {
        await Promise.all([
          document.fonts.load('400 40px "Archivo Black"'),
          document.fonts.load('500 40px "Inter"'),
          document.fonts.load('700 40px "Inter"'),
        ]);
        const DECK = window.CU_DECK;
        const OV = 0.3; // scene overlap == the transition (keep in sync with motion/slides.py)
        document.documentElement.style.setProperty("--accent", DECK.accent);
        document.getElementById("brandname").textContent = DECK.brand;
        document.getElementById("handle").textContent = "@" + DECK.handle;

        const el = (tag, cls, text, parent) => {
          const e = document.createElement(tag);
          if (cls) e.className = cls;
          if (text != null) e.textContent = text;
          if (parent) parent.appendChild(e);
          return e;
        };
        const fit = (node, maxH, start, min) => {
          let s = start; node.style.fontSize = s + "px";
          while (node.offsetHeight > maxH && s > min) { s -= 2; node.style.fontSize = s + "px"; }
        };
        const words = (node, text) => {
          text.trim().split(/\s+/).forEach((w) => {
            const o = el("span", "w", null, node);
            o.setAttribute("data-layout-allow-overflow", ""); o.setAttribute("data-layout-allow-occlusion", "");
            const i = el("span", null, w, o);
            i.setAttribute("data-layout-allow-occlusion", "");
          });
        };

        const tl = gsap.timeline({ paused: true });
        const scenesEl = document.getElementById("scenes");
        const slides = DECK.slides;
        let t = 0;
        const starts = slides.map((s) => { const st = t; t += s.duration - OV; return st; });
        const total = starts.length ? starts[starts.length - 1] + slides[slides.length - 1].duration : 1;

        // Ambient + global progress across the whole reel.
        tl.fromTo("#glow", { x: -80, y: 40, scale: 0.9 }, { x: 80, y: -60, scale: 1.12, duration: total, ease: "sine.inOut" }, 0);
        tl.fromTo("#grid", { y: 0 }, { y: 180, duration: total, ease: "none" }, 0);
        tl.fromTo("#progress", { scaleX: 0 }, { scaleX: 1, duration: total, ease: "none" }, 0);
        tl.from(".brand", { opacity: 0, x: -30, duration: 0.25, ease: "power4.out" }, 0);

        // Fast entrances (house rules: text lands in 0.15-0.35 s, items x stagger <= ~0.35 s).
        const E = 0.3;
        const stag = (n, per) => Math.min(per, 0.35 / Math.max(n, 1));
        const B = {};
        const head = (sc, s, size, maxH) => {
          if (s.kicker) el("div", "kicker", s.kicker, sc);
          if (!s.heading) return null;
          const h = el("h1", "h", null, sc); words(h, s.heading); fit(h, maxH, size, 44);
          return h;
        };
        const introHead = (sc, a, D, slam) => {
          const k = sc.querySelector(".kicker");
          if (k) tl.from(k, { opacity: 0, scale: 0.6, transformOrigin: "left center", duration: D(0.22), ease: "back.out(2.2)" }, a(0));
          const ws = sc.querySelectorAll(".h .w > span");
          if (ws.length) {
            if (slam) tl.from(ws, { yPercent: 120, scale: 1.25, duration: D(E), ease: "power4.out", stagger: stag(ws.length, 0.05) }, a(0.04));
            else tl.from(ws, { yPercent: 120, duration: D(E), ease: "power4.out", stagger: stag(ws.length, 0.04) }, a(0.04));
          }
        };
        const bodyIn = (sc, s, a, D, size, maxH, delay) => {
          if (!s.body) return;
          const b = el("p", "body", s.body, sc); fit(b, maxH, size, 30);
          tl.from(b, { opacity: 0, y: 24, duration: D(0.28), ease: "power3.out" }, a(delay));
        };
        const barIn = (sc, a, D, delay) => {
          const b = el("div", "bar", null, sc);
          tl.from(b, { scaleX: 0, duration: D(0.3), ease: "expo.out" }, a(delay));
        };

        B.hook = B.hero = (sc, s, a, D) => {
          head(sc, s, 118, 560); introHead(sc, a, D, true); barIn(sc, a, D, 0.2); bodyIn(sc, s, a, D, 42, 200, 0.3);
        };
        B.text = B.conclusion = (sc, s, a, D) => {
          head(sc, s, 96, 420); introHead(sc, a, D); barIn(sc, a, D, 0.2); bodyIn(sc, s, a, D, 46, 460, 0.28);
        };
        B.evidence = (sc, s, a, D) => {
          head(sc, s, 80, 260); introHead(sc, a, D);
          const facts = (s.facts || []).slice(0, 4);
          const size = facts.length > 3 ? 36 : 42;
          facts.forEach((f, i) => {
            const c = el("div", "card", f, sc); c.style.fontSize = size + "px";
            tl.from(c, { opacity: 0, x: -70, duration: D(0.24), ease: "power4.out" }, a(0.18 + i * stag(facts.length, 0.12)));
          });
          if (!facts.length) bodyIn(sc, s, a, D, 44, 460, 0.28);
        };
        B.stats = (sc, s, a, D) => {
          head(sc, s, 68, 200); introHead(sc, a, D);
          const facts = (s.facts || []).slice(0, 4);
          const grid = el("div", "tiles", null, sc);
          grid.style.gridTemplateColumns = facts.length > 2 ? "1fr 1fr" : "1fr";
          facts.forEach((f, i) => {
            const m = f.match(/^(\S*\d\S*)\s*(.*)$/);
            const tile = el("div", "tile", null, grid);
            const num = el("div", "num", m ? m[1] : f, tile);
            if (m && m[2]) el("div", "lab", m[2], tile).style.fontSize = "34px";
            num.style.fontSize = (facts.length > 2 ? 84 : 124) + "px";
            const at = a(0.15 + i * stag(facts.length, 0.1));
            tl.from(tile, { opacity: 0, y: 40, scale: 0.9, duration: D(0.25), ease: "back.out(1.8)" }, at);
            const nm = m && m[1].match(/^([^\d]*)([\d][\d,]*\.?\d*)(.*)$/);
            if (nm) { // fast count-up, seek-safe
              const target = parseFloat(nm[2].replace(/,/g, ""));
              const dec = (nm[2].split(".")[1] || "").length;
              const o = { v: 0 };
              tl.to(o, { v: target, duration: D(0.5), ease: "power3.out", onUpdate: () => {
                const txt = dec ? o.v.toFixed(dec) : Math.round(o.v).toLocaleString("en-US");
                num.textContent = nm[1] + txt + nm[3];
              } }, at);
            }
          });
        };
        B.timeline = (sc, s, a, D) => {
          head(sc, s, 68, 200); introHead(sc, a, D);
          const evs = (s.timeline || []).slice(0, 4);
          const box = el("div", "tl", null, sc);
          const line = el("div", "line", null, box);
          tl.from(line, { scaleY: 0, duration: D(0.45), ease: "power3.inOut" }, a(0.1));
          evs.forEach((e, i) => {
            const row = el("div", "ev", null, box);
            el("div", "when", e.when, row).style.fontSize = "30px";
            el("div", "what", e.what, row).style.fontSize = (evs.length > 3 ? 36 : 42) + "px";
            tl.from(row, { opacity: 0, x: 50, duration: D(0.22), ease: "power4.out" }, a(0.15 + i * stag(evs.length, 0.12)));
          });
        };
        B.money_flow = (sc, s, a, D) => {
          head(sc, s, 62, 180); introHead(sc, a, D);
          const steps = (s.money || []).slice(0, 4);
          const wrap = el("div", null, null, sc); wrap.style.marginTop = "30px";
          steps.forEach((st, i) => {
            const at = a(0.12 + i * stag(steps.length, 0.14));
            if (i > 0) {
              const l = el("div", "link", null, wrap);
              const stem = el("div", "stem", null, l);
              if (st.amount) el("div", "amt", st.amount, l).style.fontSize = "38px";
              tl.from(stem, { scaleY: 0, duration: D(0.16), ease: "power3.out" }, at);
              if (st.amount) tl.from(l.querySelector(".amt"), { opacity: 0, x: -20, duration: D(0.18) }, at);
            }
            const n = el("div", "node", null, wrap);
            el("div", "actor", st.actor, n).style.fontSize = (steps.length > 3 ? 36 : 44) + "px";
            if (st.detail) el("div", "detail", st.detail, n).style.fontSize = "28px";
            tl.from(n, { opacity: 0, scale: 0.88, duration: D(0.22), ease: "back.out(1.8)" }, at);
          });
        };
        B.comparison = (sc, s, a, D) => {
          const c = s.comparison || {};
          head(sc, { kicker: s.kicker, heading: c.title || s.heading }, 66, 220); introHead(sc, a, D);
          const vs = el("div", "vs", null, sc);
          const num = (v) => { const m = String(v).replace(/,/g, "").match(/-?\d+(\.\d+)?/); return m ? parseFloat(m[0]) : null; };
          const na = num(c.value_a), nb = num(c.value_b);
          const both = na != null && nb != null && Math.max(na, nb) > 0;
          [["a", c.label_a, c.value_a, na], ["b", c.label_b, c.value_b, nb]].forEach(([k, lab, val, n], i) => {
            const side = el("div", "side " + k, null, vs);
            const big = el("div", "big", String(val), side); fit(big, 150, 80, 34);
            el("div", "lab", lab, side).style.fontSize = "28px";
            if (both) {
              const m = el("div", "meter", null, side); const f = el("i", null, null, m);
              f.style.width = Math.max(4, Math.abs(n) / Math.max(Math.abs(na), Math.abs(nb)) * 100) + "%";
              tl.from(f, { scaleX: 0, duration: D(0.45), ease: "expo.out" }, a(0.3 + i * 0.1));
            }
            tl.from(side, { opacity: 0, y: 50, duration: D(0.26), ease: "power4.out" }, a(0.1 + i * 0.1));
          });
        };
        B.quote = (sc, s, a, D) => {
          const q = s.quote || { text: s.body || s.heading || "" };
          if (s.kicker) el("div", "kicker", s.kicker, sc);
          const m = el("div", "qmark", "“", sc);
          const tx = el("p", "h", null, sc); tx.style.textTransform = "none"; tx.textContent = q.text; fit(tx, 520, 66, 32);
          if (q.attribution) { const at = el("div", "attr", "— " + q.attribution, sc); at.style.fontSize = "34px"; tl.from(at, { opacity: 0, x: -30, duration: D(0.25), ease: "power3.out" }, a(0.3)); }
          const k = sc.querySelector(".kicker");
          if (k) tl.from(k, { opacity: 0, scale: 0.6, transformOrigin: "left center", duration: D(0.22), ease: "back.out(2.2)" }, a(0));
          tl.from(m, { opacity: 0, scale: 0.4, transformOrigin: "left center", duration: D(0.26), ease: "back.out(2.4)" }, a(0.04));
          tl.from(tx, { opacity: 0, y: 36, duration: D(0.3), ease: "power4.out" }, a(0.12));
        };
        B.cta = (sc, s, a, D) => {
          sc.classList.add("ctawrap");
          const box = el("div", "ringbox", null, sc);
          const ring = el("div", "ring", null, box);
          const img = el("img", null, null, box); img.src = "assets/logo.png"; img.alt = "";
          const h = el("h1", "h", null, sc); words(h, s.heading || "Follow for more"); fit(h, 300, 88, 44);
          const hd = el("div", "big-handle", "@" + DECK.handle, sc); fit(hd, 160, 72, 36);
          tl.from(img, { scale: 0.3, opacity: 0, duration: D(0.3), ease: "back.out(2.2)" }, a(0));
          tl.fromTo(ring, { scale: 0.8, opacity: 0.9 }, { scale: 1.25, opacity: 0, duration: 0.6, ease: "power1.out", repeat: 2 }, a(0.2));
          tl.from(h.querySelectorAll(".w > span"), { yPercent: 120, duration: D(E), ease: "power4.out", stagger: stag(8, 0.05) }, a(0.08));
          tl.from(hd, { opacity: 0, y: 24, duration: D(0.25), ease: "power3.out" }, a(0.3));
        };

        // Transitions ARE the exit: outgoing and incoming move together (house rule: no
        // fade-out-then-enter). One primary (push) + two accents (whip, zoom-through).
        const TRANS = ["push", "push", "whip", "push", "zoom", "push", "whip", "push"];
        const scs = slides.map((s, i) => {
          const sc = el("div", "scene", null, scenesEl); sc.setAttribute("data-layout-allow-overlap", ""); sc.setAttribute("data-layout-allow-overflow", "");
          const dur = s.duration, t0 = starts[i];
          const k = Math.min(1, Math.max(0.5, (dur - OV - 0.2) / 1.0));
          const a = (x) => t0 + x * k, D = (x) => x * k;
          (B[s.kind] || B.text)(sc, s, a, D);
          return sc;
        });
        scs.forEach((sc, i) => {
          const T = starts[i];
          if (i === 0) { tl.set(sc, { opacity: 1 }, 0); return; }
          const prev = scs[i - 1], kind = TRANS[(i - 1) % TRANS.length];
          if (kind === "push") {
            tl.fromTo(sc, { yPercent: 100, opacity: 1 }, { yPercent: 0, duration: OV, ease: "power4.out", immediateRender: false }, T);
            tl.to(prev, { yPercent: -100, duration: OV, ease: "power4.out" }, T);
          } else if (kind === "whip") {
            tl.fromTo(sc, { xPercent: 100, opacity: 1 }, { xPercent: 0, duration: OV, ease: "expo.out", immediateRender: false }, T);
            tl.to(prev, { xPercent: -100, duration: OV, ease: "expo.out" }, T);
          } else { // zoom-through
            tl.fromTo(sc, { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: OV, ease: "power4.out", immediateRender: false }, T);
            tl.to(prev, { scale: 1.45, opacity: 0, duration: OV, ease: "power4.in" }, T);
          }
          tl.set(prev, { opacity: 0 }, T + OV); // parked scenes are hidden once they've left
        });
        // every non-first scene starts off-screen/hidden until its transition
        scs.forEach((sc, i) => { if (i > 0) tl.set(sc, { opacity: 0 }, 0); });
        // final scene: only scene allowed to fade out
        tl.to(scs[scs.length - 1], { opacity: 0, duration: 0.25, ease: "power2.in" }, total - 0.25);
        window.__timelines["cu-reel"] = tl;
      })();
    </script>
  </body>
</html>
