[project]
name = "narovva"
version = "0.1.0"
description = "Multi-channel, multi-genre pipeline: find news, render social assets, write captions, publish."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
    "vercel_blob>=0.4,<0.5",  # 0.5 moved to the vercel.blob namespace with a new API
    "cryptography>=42.0",
    "imageio-ffmpeg>=0.5",
    "pillow>=10.0",
    "poster-core[all] @ git+https://github.com/CosmiX-6/poster-core.git@909ad505506c4b99e5458332daa974ee1eb6d9ef",
    "info-snipe[postgres] @ git+https://github.com/CosmiX-6/info-snipe.git@6e6e07a8626fcf5b1b0a120897e732b4d9ec700d",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.6"]
# Free local voice-over (Kokoro): no API key, runs inside the job. ~350 MB model, cached.
narration-local = ["kokoro-onnx>=0.4", "soundfile>=0.12"]
# Trending hashtag lookup via Google Trends (requires pandas).
trending = ["pytrends>=4.9"]
# Character reels (narovva.characters): 2D compositor, cast voices, score + sound effects.
characters = ["skia-python>=87.6", "edge-tts>=7.0", "numpy>=1.26", "scipy>=1.11"]

[project.scripts]
narovva = "narovva.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/narovva"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Real errors (F, E9), import order (I) and modern syntax (UP).
select = ["E9", "F", "I", "UP"]
# StrEnum changes str(member); the (str, Enum) classes keep their old behaviour.
ignore = ["UP042"]

[tool.ruff.lint.isort]
known-first-party = ["narovva"]
