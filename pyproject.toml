[project]
name = "narovva"
version = "0.1.0"
description = "Multi-channel, multi-genre pipeline: find news, render social assets, write captions, publish."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
    "vercel_blob>=0.4",
    "cryptography>=42.0",
    "poster-core[all] @ git+https://github.com/CosmiX-6/poster-core.git@19b61c782e9b6b2a23e42cef14e350730716a4f9",
    "info-snipe @ git+https://github.com/CosmiX-6/info-snipe.git@31dfd1da5ef96ccaeeb5266cfd3101c38793502d",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
narovva = "narovva.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/narovva"]

[tool.pytest.ini_options]
testpaths = ["tests"]
