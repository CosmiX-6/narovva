[project]
name = "narovva"
version = "0.1.0"
description = "Multi-channel, multi-genre pipeline: find news, render social assets, write captions, publish."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
    "vercel_blob>=0.4",
    "cryptography>=42.0",
    "imageio-ffmpeg>=0.5",
    "pillow>=10.0",
    "poster-core[all] @ git+https://github.com/CosmiX-6/poster-core.git@066dfb98352befd31a0f6281c3f11fbde012dade",
    "info-snipe[postgres] @ git+https://github.com/CosmiX-6/info-snipe.git@2eec16deed7dcd601747af494185cb8b2c11c9f1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# Free local voice-over (Kokoro): no API key, runs inside the job. ~350 MB model, cached.
narration-local = ["kokoro-onnx>=0.4", "soundfile>=0.12"]

[project.scripts]
narovva = "narovva.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/narovva"]

[tool.pytest.ini_options]
testpaths = ["tests"]
