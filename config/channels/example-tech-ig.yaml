# The live config of Context Unfiltered (instagram.com/contextunfiltered), an
# Instagram account covering AI, tech, health and finance news, plus short lessons on
# how AI works. It doubles as the reference for
# every option: copy it to config/channels/<your-channel>.yaml and change the
# account id, brand, genres and credentials names for your own account.
# File/id kept as example-tech-ig for continuity with existing credentials,
# dedup history and GitHub Actions secrets.

enabled: true
platform: instagram

# The Instagram account's id. New Meta apps only get "API setup with Unified login" (Facebook
# Login for Business): its tokens start with EAA, are used on graph.facebook.com, and address
# the account by the id the app dashboard shows next to it (Instagram > API setup with Unified
# login > Generate access tokens). An Instagram Login token (IGAA..., graph.instagram.com,
# older apps) uses that API's own id instead: curl "https://graph.instagram.com/v21.0/me?fields=user_id,username&access_token=..."
ig_business_account_id: "17841477345424555"
# Unused: no Facebook Page is involved.
ig_page_id: null

# Post at most one item every 2 hours, cycling through the genres below in order
# (ai -> tech -> lessons -> health -> finance -> ai ...). Overrides each genre's own cadence_minutes for
# scheduling purposes (still used as each fetch's article-freshness window).
rotation_minutes: 120

# Post as motion-graphics Reels (HyperFrames; falls back to the plain
# Ken-Burns reel if the motion render fails) with genre/mood-matched music.
publish_format: motion_reel

# Content language -- the one switch: `en` (default) or `hi`.
#   hi = a HINDI voice-over, the ENGLISH transcript/graphics on screen, and a HINGLISH
#        caption (Hindi in Roman letters mixed with English terms); hashtags stay English.
# Per genre, set `language:` on a genre below to override this for just that genre.
# For one manual run: Actions -> "Hourly publish" -> Run workflow -> language
# (or `narovva run-channel ... --language hi`). Free Hindi voices (Kokoro) need no key.
language: en

# Voice-over for the motion reel. A different voice is picked for every video
# (never one used in the last few posts), delivery follows the story's tone, and
# the music ducks under the voice. Any failure posts the reel with music only.
# Audition the voices first: Actions -> "Audition narration voices".
narration:
  provider: openai   # uses OPENAI_API_KEY; or gemini (GOOGLE_API_KEY) / elevenlabs
  # Tried in order if the primary fails (quota, outage, missing key). 'kokoro' is a free
  # local voice that needs no key, so there is always a voice.
  fallback_providers: [gemini, kokoro]
  # Never used, whichever provider reads (picked by ear from the voice samples).
  exclude_voices: [af_nicole]
  # How the voice says the channel name when the language is Hindi (a Hindi voice garbles
  # Latin names, so this is the Devanagari spelling).
  spoken_names:
    hi: "कॉन्टेक्स्ट अनफिल्टर्ड"
  # Hindi voices to rotate through (Kokoro's: hf_alpha, hf_beta women; hm_omega, hm_psi men).
  # Unset: Kokoro's Hindi voices as the fallback, and the provider's own voices for OpenAI/Gemini.
  # voices_by_language:
  #   hi: [hf_alpha, hm_omega]

# Viral posts: on top of the rotation, at least one post per slot below of whatever
# story the internet is talking about right now -- any genre, as long as it is
# informative (an AI editor rejects sports scores, gossip, lotteries). "Viral" =
# carried by several big outlets within the last few hours, boosted when it is also
# a hot Google search. Each post opens on a curiosity/stakes hook. A slot missed
# (nothing fresh, a dropped scheduler run) is made up in the next slot's window.
# Slots are Instagram peak hours in IST: 09:00 and 13:00 for India; 19:00 and 21:30
# IST are 09:30 and 12:00 US Eastern, the US morning and lunch peaks.
# Check what it would pick right now: `narovva viral-scan <this file> --editor`.
# Post one now from Actions: "Hourly publish" -> Run workflow -> viral = true.
viral:
  enabled: true
  timezone: "Asia/Kolkata"
  slots: ["09:00", "13:00", "19:00", "21:30"]
  slot_window_minutes: 120
  max_age_minutes: 240      # every report counted is at most 4 hours old
  min_sources: 2            # outlets carrying the story
  trends_geos: [US, IN]
  hook_style: auto          # curiosity | stakes | auto (the model picks per story)
  asset_types: [cover, carousel]

# Temporary focus (off since 2026-11-17, when the channel widened to AI, tech, health,
# finance and lessons): while enabled, every post (rotation AND viral) is a practical AI
# update for people who build with AI or use it at work. The genres below are set
# aside, viral posts must be AI stories, and an AI screener ranks fresh articles by
# how useful they are to this audience (no funding rounds, stock moves or drama).
# Set enabled: false to go back to the normal mix -- nothing else needs to change.
focus:
  enabled: false
  name: "AI for practitioners"
  audience: >-
    an engineer or knowledge worker who uses ChatGPT, Claude, Copilot or Cursor every
    day and wants to know what changed this week and what to do about it
  genres:
    - genre: ai_practitioner      # labs' blogs, changelogs, practitioners, AI trade press
      limit: 25
      cadence_minutes: 120
      asset_types: [cover, carousel]
      music_tags: [technology, electronic]
  max_age_hours: 48
  screen_with_llm: true
  caption_voice: >-
    practical and sharp, for engineers and people who use AI at work: what changed,
    what it means for their workflow, and one concrete thing to try or watch; no hype
  extra_hashtags: ["#AI", "#AIEngineering", "#GenAI", "#LLM", "#AITools"]

# Look of the motion reel. Every value below is the default; delete a line to keep it,
# change it to restyle the next reel (no code change needed).
motion:
  story:
    # animated: the whole video is one continuous 3D animation -- a small world of characters
    # and objects acting the story out through one metaphor, the camera flying from one set
    # piece to the next (gate, flow, pile, race, split, machine, wall, balance, steps, sort,
    # cluster, hill, fetch, focus, slice, window, target). Figures appear as labels in the world.
    # storyboard: motion-graphic scenes instead (date track, cause-and-effect chain, grid,
    # counting number, quote, log, checklist), with a world scene now and then.
    # Either falls back to "slides" (re-animated carousel slides) if the writer's reply doesn't
    # check out. Lessons are always animated.
    # story_first: the complete story is written first, then a picture is designed for each beat
    # from what it says, so the story never bends to fit a scene (news only; lessons stay animated).
    mode: story_first
    max_beats: 10        # 5-14
    target_seconds: 45   # what the writer aims for
    flood: true          # full-frame accent wash behind headline numbers
    # Beats where the viewer cuts in with the question they'd ask ("Wait, who pays for
    # this?"), answered by the next beat and read in a second voice. 0 = none.
    viewer_questions: 2
  hud:
    # case_file: "(rec dot) REC  CASE FILE: <SUBJECT> ..... 00:00:04:29"
    # breakdown: "(rec dot) <SUBJECT> BREAKDOWN ..... 24 OCT 2026" with the progress line under it
    # brand: the CU logo + name header. none: no header.
    # chapter: the current chapter ("WHAT HAPPENED") in a chip at the top, one dash per chapter.
    style: chapter
    # Optional custom header text: {subject} {category} {brand} {date}. Unset = the style's own.
    # label: "{subject} FILE"
    # meta: timecode     # timecode | date | none (unset = the style's own)
    rec_dot: true
  progress: auto         # auto | top | hud | bottom | none
  captions:
    style: boxed         # boxed | karaoke | pill | brighten  (on/off is narration.captions)
    highlight: "#FACC15"
    chunk_words: 4       # boxed / karaoke: most words on screen at once
  stamps:
    enabled: true        # verdict stamps like BLOCKED / FALSE / -20%, only where a slide's data backs one
    max_per_reel: 3
    negative_color: "#F43F5E"
    positive_color: "#22C55E"
    neutral_color: "#FACC15"
  timeline: cards        # cards (dated evidence cards) | spine (line + travelling dot)
  heading_marks: true    # key headline words in the accent colour
  grid: true
  show_handle: true

genres:
  - genre: ai
    limit: 8
    cadence_minutes: 60
    asset_types: [cover, carousel]
  - genre: tech
    country: us
    limit: 8
    cadence_minutes: 60
    asset_types: [cover, carousel]
  # "How AI works": one lesson per turn, in the order of config/lessons/how-ai-works.yaml
  # (each grounded in its Wikipedia article; never repeated). With 5 genres and a 2-hour
  # rotation that is about 2 lessons a day, so the 60 lessons last about a month.
  - genre: lessons
    series: how-ai-works
    asset_types: [cover, carousel]
    music_tags: [technology, ambient]
  - genre: health
    limit: 8
    cadence_minutes: 90
    asset_types: [cover, carousel]
  - genre: finance
    limit: 8
    cadence_minutes: 90
    asset_types: [cover, carousel]

brand:
  name: "CONTEXT UNFILTERED"
  # Unified navy background across every category (design system §1),
  # overriding poster_core's built-in per-category backgrounds.
  background_color: "#0A0E1A"
  # Fallback accent for any category not listed in category_accents below.
  accent_color: "#3B82F6"
  # Design system's 5 category accents, mapped onto poster_core's nearest
  # StoryCategory values -- "politics" stands in for "Policy/Society" and
  # "technology" for "Hardware/Semiconductors" since poster_core has no
  # exact match for either.
  category_accents:
    ai: "#3B82F6"
    science: "#14B8A6"
    business: "#F59E0B"
    politics: "#A855F7"
    technology: "#EC4899"
  footer: null
  logo_path: "assets/logo/CU.png"
  social_handle: "contextunfiltered"
  # Fonts for the cover and the plain-reel fallback (the motion reel uses its own
  # vendored web fonts). Any .ttf works: drop it in assets/fonts/ and point here.
  font_path_bold: "assets/fonts/DejaVuSans-Bold.ttf"
  font_path_regular: "assets/fonts/DejaVuSans-Regular.ttf"

# The channel's voice: every writer (hook, cover, caption, storyboard, script, the
# story editors) gets these rules, and banned words are also filtered in code from
# the hook, the cover and the caption. While the focus above is on, its audience
# replaces the one here. Edit freely -- no code change needed.
voice:
  audience: >-
    a curious professional who follows AI, tech, health and money and wants the context
    behind the headline -- or how a piece of AI actually works -- in under a minute, without hype
  banned_words: [game-changer, game changer, dive in, deep dive, unlock, revolutionary,
                 mind-blowing, insane, crazy, "let's get into it", buckle up, "in today's video",
                 skyrocket, supercharge, "the future is here", jaw-dropping, smash that]
  never_claim:
    - performance numbers, prices or dates that are not in the article
    - that we tested or used a product ourselves
    - predictions stated as facts
    - financial or legal advice
  format: >-
    about 30 seconds; no channel intro; the first line is the hook; one idea per scene;
    one ask at the end (follow the channel)

# Formula hooks (narovva/hooks/formulas.yaml) on EVERY post, not just viral ones: five
# options per post, each from a different formula, scored (narovva/hooks/score.py);
# the best one opens the reel, with a 2-4 word cover title and a caption first line
# that say different things. Viral posts always get one.
hooks:
  enabled: true
  formulas: [the-mistake, the-warning, the-comparison, the-stack, the-deadline,
             the-question, the-direct-address, the-statistic, the-before-after,
             the-impossible-claim]
  min_score: 45
  candidates: 5
  # Lean toward formulas that beat this channel's median (from the daily metrics).
  # Inactive until a formula has 20 measured posts; 20% of posts still try them all.
  learn: true

caption:
  voice: "sharp, informative, no clickbait, written for a tech-savvy audience"
  emoji: true
  max_hashtags: 6
  hashtag_style: footer
  extra_hashtags: ["#tech", "#ai"]

credentials:
  # Names of env vars / Actions secrets, never the values themselves.
  instagram_access_token_env: "IG_ACCESS_TOKEN__example_tech_ig"
  openai_api_key_env: "OPENAI_API_KEY"
  gemini_api_key_env: "GOOGLE_API_KEY"
  openrouter_api_key_env: "OPENROUTER_API_KEY"
  anthropic_api_key_env: "ANTHROPIC_API_KEY"
  claude_code_oauth_token_env: "CLAUDE_CODE_OAUTH_TOKEN"
  # Free client_id from https://devportal.jamendo.com -- used to pick
  # commercial-use-safe background music for Reels.
  jamendo_client_id_env: "JAMENDO_CLIENT_ID__example_tech_ig"

text_provider: gemini
# Text-model fallback chain (analysis, caption, voice-over script), tried in order
# ("provider[:model]"). A model whose quota is spent, or that is overloaded, is skipped
# and the next one answers. Free-tier quotas are per model, so each Gemini model is its
# own pool; openrouter ':free' models are a separate provider (OPENROUTER_API_KEY
# secret; entries without a key are skipped). Free model names change: check
# https://openrouter.ai/models?q=free and edit here, no code change needed. A retired or
# misspelled model id (404) is skipped for the run; Google's 404 names the replacement.
# Claude is the primary model, so the storyboard and director calls stop falling over by mid-day:
#   claude-code: your claude.ai plan (CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`), through
#                the Claude Code CLI. Shares the plan's usage limit with your own Claude use; when
#                the limit is hit, the next entry answers for the rest of the run.
#   anthropic:   a Console API key (ANTHROPIC_API_KEY), billed per token.
# Entries without their secret are skipped; the free models behind answer if Claude is unavailable.
# claude-opus-5-5 writes better stories and uses the plan / the bill about twice as fast.
llm_chain:
  - claude-code:claude-sonnet-5-5
  - anthropic:claude-sonnet-5-5
  - gemini:gemini-flash-latest
  - gemini:gemini-3.8-flash          # the newest Flash, its own free-tier pool
  - gemini:gemini-3.5-flash-lite
  - openrouter:meta-llama/llama-3.3-70b-instruct:free
  - openrouter:qwen/qwen3-235b-a22b:free
  - openai:gpt-4o-mini
# A stronger model for the storyboard writer only -- the call that decides how good the video
# is -- tried before llm_chain (which stays the fallback). Pro models are paid (they need billing
# on the Google key; without it they are skipped and llm_chain writes):
#   gemini:gemini-3.1-pro-preview  $2 / $12 per 1M tokens in / out, roughly $0.05-0.15 a storyboard
# use_for: lessons (only the "How AI works" posts) or all (every post).
writer:
  # Claude Opus 5.5 writes and directs every story (story-first's two calls, the ones that decide the video);
  # the plan's token first, then an API key, then llm_chain. Everything else stays on llm_chain (Sonnet).
  chain:
    - claude-code:claude-opus-5-5
    - anthropic:claude-opus-5-5
  use_for: all

# 'none': poster_core's Gemini image generation uses Imagen, which the Gemini
# Developer API key can't call (every article lacking a usable image failed).
# Posts use the article's own image, else the branded text layout.
image_provider: none
