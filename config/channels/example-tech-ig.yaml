# Context Unfiltered: an Instagram account covering tech + AI news, run to
# the "Context Unfiltered" design system (see the project's improvement.md
# spec). File/id kept as example-tech-ig for continuity with existing
# credentials, dedup history and GitHub Actions secrets.

enabled: true
platform: instagram

# Instagram-scoped user id from Instagram API with Instagram Login (not the
# Facebook-Page-linked Business Account id -- different namespace). Get it
# with: curl "https://graph.instagram.com/v21.0/me?fields=id,username&access_token=..."
ig_business_account_id: "27851606094524604"
# Unused by the Instagram Login flow (no Facebook Page involved); left unset.
ig_page_id: null

# Post at most one item every 2 hours, alternating tech -> ai -> tech -> ...
# in the order listed below. Overrides each genre's own cadence_minutes for
# scheduling purposes (still used as each fetch's article-freshness window).
rotation_minutes: 120

# Post as motion-graphics Reels (HyperFrames; falls back to the plain
# Ken-Burns reel if the motion render fails) with genre/mood-matched music.
publish_format: motion_reel

# Voice-over for the motion reel. A different voice is picked for every video
# (never one used in the last few posts), delivery follows the story's tone, and
# the music ducks under the voice. Any failure posts the reel with music only.
# Audition the voices first: Actions -> "Audition narration voices".
narration:
  provider: openai   # uses OPENAI_API_KEY; or gemini (GOOGLE_API_KEY) / elevenlabs

genres:
  - genre: tech
    country: us
    limit: 3
    cadence_minutes: 60
    asset_types: [cover, carousel]
  - genre: ai
    limit: 3
    cadence_minutes: 60
    asset_types: [cover, carousel]

brand:
  name: "CONTEXT UNFILTERED"
  # Unified navy background across every category (design system §1),
  # overriding poster_core's built-in per-category backgrounds.
  background_color: "#0A0E1A"
  # Fallback accent for any category not listed in category_accents below.
  accent_color: "#3B82F6"
  # Design system's 5 category accents, mapped onto poster_core's nearest
  # StoryCategory values -- "politics" stands in for "Policy/Society" and
  # "technology" for "Hardware/Semiconductors" since poster_core has no
  # exact match for either.
  category_accents:
    ai: "#3B82F6"
    science: "#14B8A6"
    business: "#F59E0B"
    politics: "#A855F7"
    technology: "#EC4899"
  footer: null
  logo_path: "assets/logo/CU.png"
  social_handle: "contextunfiltered"
  # TODO: swap for the design system's Archivo Black/Space Grotesk Bold/Sora
  # ExtraBold (headline) + Inter/Sora Regular (body) once those .ttf files
  # are sourced -- drop them in assets/fonts/ and update these two paths,
  # no code change needed.
  font_path_bold: "assets/fonts/DejaVuSans-Bold.ttf"
  font_path_regular: "assets/fonts/DejaVuSans-Regular.ttf"

caption:
  voice: "sharp, informative, no clickbait, written for a tech-savvy audience"
  emoji: true
  max_hashtags: 6
  hashtag_style: footer
  extra_hashtags: ["#tech", "#ai"]

credentials:
  instagram_access_token_env: "IG_ACCESS_TOKEN__example_tech_ig"
  instagram_app_id_env: "IG_APP_ID__example_tech_ig"
  instagram_app_secret_env: "IG_APP_SECRET__example_tech_ig"
  openai_api_key_env: "OPENAI_API_KEY"
  gemini_api_key_env: "GOOGLE_API_KEY"
  # Free client_id from https://devportal.jamendo.com -- used to pick
  # commercial-use-safe background music for Reels.
  jamendo_client_id_env: "JAMENDO_CLIENT_ID__example_tech_ig"

text_provider: gemini
# 'none': poster_core's Gemini image generation uses Imagen, which the Gemini
# Developer API key can't call (every article lacking a usable image failed).
# Posts use the article's own image, else the branded text layout.
image_provider: none
