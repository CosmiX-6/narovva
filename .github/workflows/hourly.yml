name: Hourly publish

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      genre:
        description: "Force a specific genre now, bypassing the rotation cooldown (e.g. tech, ai). Leave blank for normal due-check behavior."
        required: false
        type: string
      viral:
        description: "Post one viral story now (any genre), ignoring the peak-hour slots."
        required: false
        type: boolean
        default: false
      language:
        description: "Content language for this manual run: en or hi (Hindi voice, English on-screen text, Hinglish caption). Use with 'genre' or 'viral'. Blank = the channel config."
        required: false
        type: choice
        options: ["", en, hi]
        default: ""

# One publish run at a time. GitHub's own cron is late or dropped most hours,
# so an outside scheduler may also dispatch this workflow; a run that starts
# while another is still rendering would see the same genre as due and post it
# twice. Queued instead, it starts after the post is recorded and finds
# nothing due.
concurrency:
  group: publish
  cancel-in-progress: false

# Read-only GITHUB_TOKEN: no workflow here writes to the repo.
permissions:
  contents: read

jobs:
  run-due-channels:
    runs-on: ubuntu-latest
    # motion_reel renders ~3s of video per second of reel (~2-3 min per post);
    # the extra headroom is for the Node/Chrome setup and a fallback re-render.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install narovva
        # narration-local: the free Kokoro voice; trending: Google Trends hashtags
        run: pip install ".[narration-local,trending,characters]"

      # HyperFrames (motion_reel format): Node 22 + pinned CLI + Chrome Headless
      # Shell. FFmpeg is installed explicitly. If any of this fails the run still
      # posts, because motion_reel falls back to the plain Ken-Burns reel.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Restore Chrome before 'browser ensure', so a cache hit skips the 114 MB download.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hyperframes
          key: hyperframes-chrome-${{ hashFiles('package-lock.json') }}

      - name: Install HyperFrames
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libegl1 libgl1
          npm ci --no-audit --no-fund
          npx hyperframes telemetry disable
          npx hyperframes browser ensure
        continue-on-error: true

      - uses: actions/cache@v4
        with:
          path: ~/.cache/narovva
          key: kokoro-model-v1

      - name: Run every channel/genre currently due
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          IG_ACCESS_TOKEN__example_tech_ig: ${{ secrets.IG_ACCESS_TOKEN__EXAMPLE_TECH_IG }}
          JAMENDO_CLIENT_ID__example_tech_ig: ${{ secrets.JAMENDO_CLIENT_ID__EXAMPLE_TECH_IG }}
          # Passed as data, never pasted into the script (no shell injection from the input).
          FORCE_GENRE: ${{ inputs.genre }}
          FORCE_VIRAL: ${{ inputs.viral }}
          FORCE_LANGUAGE: ${{ inputs.language }}
        run: |
          lang=()
          if [ -n "$FORCE_LANGUAGE" ]; then lang=(--language "$FORCE_LANGUAGE"); fi
          if [ "$FORCE_VIRAL" = "true" ]; then
            narovva run-viral config/channels/example-tech-ig.yaml --force "${lang[@]}"
          elif [ -n "$FORCE_GENRE" ]; then
            narovva run-channel config/channels/example-tech-ig.yaml --genre "$FORCE_GENRE" --max-posts-per-genre 1 "${lang[@]}"
          else
            narovva run-due
          fi

      # Deletes hosted media a crashed run left behind (older than 30 minutes).
      # Housekeeping only: a failure here never fails the run.
      - name: Sweep orphaned media
        if: always()
        continue-on-error: true
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: narovva sweep-blobs

      - name: Upload rendered reels
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-reels
          path: /tmp/narovva/**/*.mp4
          if-no-files-found: ignore
          retention-days: 7
