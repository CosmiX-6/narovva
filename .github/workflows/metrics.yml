name: Performance metrics

# Daily: snapshot Instagram insights for every post from the last 14 days, then
# write the performance report (each post vs the channel's own median, by hook
# formula and topic) to this run's summary page. Read-only on Instagram.
on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

concurrency:
  group: metrics
  cancel-in-progress: false

# Read-only GITHUB_TOKEN: no workflow here writes to the repo.
permissions:
  contents: read

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install narovva
        run: pip install .
      - name: Collect insights
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          IG_ACCESS_TOKEN__example_tech_ig: ${{ secrets.IG_ACCESS_TOKEN__EXAMPLE_TECH_IG }}
        run: narovva collect-metrics config/channels/example-tech-ig.yaml
      - name: Performance report
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: narovva performance-report config/channels/example-tech-ig.yaml --out "$GITHUB_STEP_SUMMARY"
