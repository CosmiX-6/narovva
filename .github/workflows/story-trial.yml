name: Story writer trial

# Runs the real story writer on live material -- lessons of the channel's series (on a push:
# tokens and attention) and the freshest story of one news genre -- and renders them as
# animated reels, so a change to the writer can be judged on what the model actually writes.
# Nothing is posted, uploaded or marked as seen. Costs 2-3 text-model calls per item (one more
# when a lesson comes back incomplete), free-tier Gemini first per llm_chain.
on:
  workflow_dispatch:
    inputs:
      lesson:
        description: "Lesson id(s) from config/lessons/<series>.yaml, comma-separated"
        required: false
        default: "tokens,attention"
      genre:
        description: "News genre to try (or 'none')"
        required: false
        default: "health"
  push:
    branches: ["claude/**"]
    paths:
      - "src/narovva/motion/storyboard.py"
      - "src/narovva/motion/trial.py"
      - "src/narovva/lessons.py"
      - "src/narovva/llm/**"
      - "config/lessons/**"
      - ".github/workflows/story-trial.yml"

permissions:
  contents: read

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # two ~80 s lessons and a news reel, each written and rendered
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install .
          npm ci --no-audit --no-fund
          npx hyperframes telemetry disable
          npx hyperframes browser ensure

      # Claude Code CLI for the claude-code: model (a claude.ai plan's token). Without it, or without
      # the CLAUDE_CODE_OAUTH_TOKEN secret, that entry is skipped and the next model answers.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.328 --no-audit --no-fund
        continue-on-error: true

      - name: Write and render
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}   # optional: stock photos/clips for b-roll
          LESSON: ${{ inputs.lesson || 'tokens,attention' }}
          GENRE: ${{ inputs.genre || 'health' }}
        run: python -u -m narovva.motion.trial trial-out ${LESSON:+--lesson "$LESSON"} --genre "$GENRE"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: story-trial
          path: trial-out/
          retention-days: 7
