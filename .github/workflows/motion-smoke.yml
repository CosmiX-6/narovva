name: Motion reel smoke test

# Proves the HyperFrames toolchain works on a clean GitHub runner: installs
# Node + pinned hyperframes + Chrome, runs the test suite (including a real
# 2-slide render), then renders the all-slide-kinds sample deck and uploads it.
# No secrets, nothing is published.
on:
  push:
    branches: ["claude/**"]
    paths:
      - "src/narovva/motion/**"
      - "src/narovva/lessons.py"
      - "package*.json"
      - ".github/workflows/motion-smoke.yml"
  pull_request:
    paths:
      - "src/narovva/motion/**"
      - "package*.json"
      - ".github/workflows/motion-smoke.yml"
  workflow_dispatch:

# Read-only GITHUB_TOKEN: no workflow here writes to the repo.
permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: System deps (FFmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Install
        run: |
          pip install ".[dev]"
          npm ci --no-audit --no-fund
          npx hyperframes telemetry disable
          npx hyperframes browser ensure
          npx hyperframes doctor || true

      - name: Tests
        run: python -m pytest -q

      - name: Render sample deck
        run: |
          time python -m narovva.motion motion-sample.mp4
          ffmpeg -hide_banner -i motion-sample.mp4 2>&1 | grep -E "Duration|Stream"

      - name: Render the story-world gallery (every 3D set piece)
        run: |
          time python -m narovva.motion motion-worlds.mp4 --worlds
          ffmpeg -hide_banner -i motion-worlds.mp4 2>&1 | grep -E "Duration|Stream"

      - name: Render the sample lesson
        run: |
          time python -m narovva.motion motion-lesson.mp4 --lesson
          ffmpeg -hide_banner -i motion-lesson.mp4 2>&1 | grep -E "Duration|Stream"

      - name: Extract review frames (one per second)
        run: |
          mkdir -p motion-frames world-frames lesson-frames
          ffmpeg -hide_banner -loglevel error -i motion-sample.mp4 -vf "fps=1,scale=540:-1" motion-frames/f_%03d.jpg
          ffmpeg -hide_banner -loglevel error -i motion-worlds.mp4 -vf "fps=1,scale=540:-1" world-frames/w_%03d.jpg
          ffmpeg -hide_banner -loglevel error -i motion-lesson.mp4 -vf "fps=1,scale=540:-1" lesson-frames/l_%03d.jpg

      - uses: actions/upload-artifact@v4
        with:
          name: motion-sample
          path: |
            motion-sample.mp4
            motion-worlds.mp4
            motion-lesson.mp4
            motion-frames/
            world-frames/
            lesson-frames/
          retention-days: 7
